x-arb-app: &arb-app
  image: ${ARB_IMAGE:-arbitrage-engine:local}
  build:
    context: .
    args:
      PIP_INDEX_URL: ${ARB_PIP_INDEX_URL:-https://pypi.org/simple}
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://arb:local-development-only@db:5432/arb}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: arb
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: arb
    volumes:
      - arb-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arb -d arb"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    <<: *arb-app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  api:
    <<: *arb-app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 10
  market-data:
    <<: *arb-app
    command: ["python", "-m", "app.workers", "market-data"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  analysis:
    <<: *arb-app
    command: ["python", "-m", "app.workers", "analysis"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  maintenance:
    <<: *arb-app
    command: ["python", "-m", "app.workers", "maintenance"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  arb-postgres:
