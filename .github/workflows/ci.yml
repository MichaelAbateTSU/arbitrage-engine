name: Validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: arb
          POSTGRES_PASSWORD: ci-only-database-password
          POSTGRES_DB: arb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U arb" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: pip install --require-hashes -r backend/requirements-dev.lock && pip install --no-deps -e backend
      - run: ruff check backend scripts && ruff format --check backend scripts && mypy backend/app
      - run: pytest backend/tests -q
      - name: PostgreSQL migrations and public-protocol fixtures
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://arb:ci-only-database-password@localhost:5432/arb
        run: |
          alembic upgrade head && alembic check && alembic downgrade base && alembic upgrade head
          ARB_TEST_POSTGRES_URL="$DATABASE_URL" pytest tests/test_postgres.py -q
      - run: python scripts/validate_blueprint.py
      - run: pip-audit -r backend/requirements.lock
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund --no-audit
        working-directory: frontend
      - run: npm run lint && npm run format:check && npm run typecheck && npm test && npm run build
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
  system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pip install --require-hashes -r backend/requirements-dev.lock && pip install --no-deps -e backend
      - run: npm ci --no-fund --no-audit && npm run build && npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start and test isolated demo stack
        env:
          ENVIRONMENT: test
          DATA_MODE: demo
          DATABASE_URL: sqlite+aiosqlite:////tmp/arb-e2e.db
          FRONTEND_DIST: frontend/dist
          E2E_PASSWORD: ci-only-generated-test-password-32chars
        run: |
          export ADMIN_PASSWORD_HASH="$(python -c 'import os; from argon2 import PasswordHasher; print(PasswordHasher().hash(os.environ["E2E_PASSWORD"]))')"
          export SESSION_SECRET="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          python scripts/demo_server.py > /tmp/arb-demo.log 2>&1 &
          DEMO_PID=$!
          trap 'kill "$DEMO_PID"' EXIT
          for n in $(seq 1 60); do curl -fsS http://127.0.0.1:8000/health/ready && break; sleep 1; done
          cd frontend
          npm run test:e2e
      - name: Container builds
        run: docker build -t arb-test . && docker build -t arb-frontend-test -f frontend/Dockerfile .
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failure-evidence
          path: |
            frontend/test-results
            /tmp/arb-demo.log
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
